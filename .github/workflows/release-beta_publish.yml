name: Publish (Beta)

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ github.event.release.prerelease }}
    strategy:
      matrix:
        include:
          - configuration: Beta
            architecture: x64
          - configuration: Beta
            architecture: ARM64
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout all
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: git-cliff --latest

      - name: Add changelog to release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    needs: [build, changelog]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: Beta
            architecture: x64
          - configuration: Beta
            architecture: ARM64
    permissions:
      id-token: write  # 必须：用于 Sigstore keyless 签名
      contents: write  # 用于上传到 Release

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: ./artifact

      - name: Rename binaries
        run: |
          mv "./artifact/Plain Craft Launcher 2.exe" "PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sign the binary with Sigstore (keyless)
        uses: sigstore/gh-action-sigstore-python@v3.2.0
        with:
          inputs: "PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe"
          release-signing-artifacts: true
          upload-signing-artifacts: false

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe
            PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger MirrorChyanUploading
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_uploading.yml -f channel=beta -f arch=${{ matrix.architecture == 'x64' && 'x64' || 'arm64' }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}