name: Build (CI)

permissions:
  contents: read

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - 'PCL.Core.Test/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x64
            runner: windows-latest
            rid: win-x64
            platform: x64
          - target: windows_ARM64
            runner: windows-latest
            rid: win-arm64
            platform: ARM64
          - target: linux_x64
            runner: ubuntu-latest
            rid: linux-x64
            platform: x64
          - target: linux_ARM64
            runner: ubuntu-latest
            rid: linux-arm64
            platform: ARM64
          - target: macos_ARM64
            runner: macos-latest
            rid: osx-arm64
            platform: ARM64

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: CI
      target: ${{ matrix.target }}
      rid: ${{ matrix.rid }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: 0.0.0-ci
    secrets: inherit
