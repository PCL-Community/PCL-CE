name: Build (CI)

permissions:
  contents: read

on:
  push:
    branches: [ dev ]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x64
            runner: windows-latest
            rid: win-x64
            platform: x64
          - target: windows_ARM64
            runner: windows-latest
            rid: win-arm64
            platform: ARM64
          - target: linux_x64
            runner: ubuntu-latest
            rid: linux-x64
            platform: x64
          - target: linux_ARM64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
            platform: ARM64
          - target: macos_ARM64
            runner: macos-latest
            rid: osx-arm64
            platform: ARM64
          - target: macos_x64
            runner: macos-latest
            rid: osx-x64
            platform: x64

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: CI
      target: ${{ matrix.target }}
      rid: ${{ matrix.rid }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      version: 0.0.0-ci
      include_secrets: false

  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Run tests
        timeout-minutes: 15
        run: dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c CI -p:Platform=AnyCPU --nologo --blame-hang --blame-hang-timeout 120s
