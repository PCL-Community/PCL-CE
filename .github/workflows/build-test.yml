name: Build (CI)

permissions:
  contents: read

on:
  push:
    branches: [dev]
    paths-ignore: &ignored
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '**/*.md'
      - '**/LICENSE'
      - '**/LICENCE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: CI
            runner: windows-latest
            runtime_id: win-x64
            architecture: x64
            binary_name: PCL.Desktop.exe
          - configuration: CI
            runner: windows-latest
            runtime_id: win-arm64
            architecture: ARM64
            binary_name: PCL.Desktop.exe
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      runner: ${{ matrix.runner }}
      runtime_id: ${{ matrix.runtime_id }}
      architecture: ${{ matrix.architecture }}
      binary_name: ${{ matrix.binary_name }}
      self_contained: true
      runtime_variant: SelfContained
    secrets: inherit
