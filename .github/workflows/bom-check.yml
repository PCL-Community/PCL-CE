name: Check BOM in PR files

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-bom:
    name: Check BOM
    runs-on: ubuntu-latest

    steps:
      - name: Check BOM in changed files
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const marker = '<!-- check-bom-action-comment -->';

            const headRepoOwner = context.payload.pull_request.head.repo.owner.login;
            const headRepoName = context.payload.pull_request.head.repo.name;

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number,
                per_page: 100,
              }
            );

            const bomTypes = [
              { name: 'UTF-32 BE BOM', bytes: [0x00, 0x00, 0xfe, 0xff] },
              { name: 'UTF-32 LE BOM', bytes: [0xff, 0xfe, 0x00, 0x00] },
              { name: 'UTF-8 BOM', bytes: [0xef, 0xbb, 0xbf] },
              { name: 'UTF-16 BE BOM', bytes: [0xfe, 0xff] },
              { name: 'UTF-16 LE BOM', bytes: [0xff, 0xfe] },
            ];

            function detectBom(buffer) {
              for (const bom of bomTypes) {
                if (
                  buffer.length >= bom.bytes.length &&
                  bom.bytes.every((byte, index) => buffer[index] === byte)
                ) {
                  return bom.name;
                }
              }
              return null;
            }

            function shouldCheckFile(file) {
              if (file.status === 'removed') {
                return false;
              }

              if (file.additions === 0 && file.changes === 0) {
                return false;
              }

              const filename = file.filename;
              const basename = path.basename(filename);
              const ext = path.extname(filename).toLowerCase();

              if (
                basename === '.editorconfig' ||
                basename === '.gitattributes' ||
                basename === '.gitignore' ||
                basename === 'Dockerfile'
              ) {
                return true;
              }

              return [
                '.vb',
                '.cs',
                '.xaml',
                '.resx',
                '.sln',
                '.slnx',
                '.vbproj',
                '.csproj',
                '.props',
                '.targets',
                '.config',
                '.json',
                '.xml',
                '.yml',
                '.yaml',
                '.md',
                '.txt',
                '.ps1',
                '.sh'
              ].includes(ext);
            }

            async function readFirstBytes(file) {
              const response = await github.rest.git.getBlob({
                owner: headRepoOwner,
                repo: headRepoName,
                file_sha: file.sha,
              });

              if (response.data.encoding !== 'base64') {
                core.warning(`Skip ${file.filename}: unsupported blob encoding ${response.data.encoding}`);
                return null;
              }

              return Buffer.from(response.data.content, 'base64').subarray(0, 4);
            }

            const found = [];

            for (const file of changedFiles) {
              if (!shouldCheckFile(file)) {
                core.info(`Skip ${file.filename}`);
                continue;
              }

              let buffer;
              try {
                buffer = await readFirstBytes(file);
              } catch (error) {
                core.warning(`Failed to read ${file.filename}: ${error.message}`);
                continue;
              }

              if (!buffer) {
                continue;
              }

              const bom = detectBom(buffer);

              if (bom) {
                found.push({
                  filename: file.filename,
                  bom,
                });
              }
            }

            if (found.length === 0) {
              core.info('No BOM found in changed PR files.');
              return;
            }

            const fileList = found
              .map(item => `- \`${item.filename}\`: ${item.bom}`)
              .join('\n');

            const body = [
              marker,
              '发现以下 PR 变更文件存在 BOM，请移除后重新提交：',
              '',
              fileList,
            ].join('\n');

            for (const item of found) {
              core.error(`${item.bom} found. Please remove BOM.`, {
                file: item.filename,
                startLine: 1,
                endLine: 1,
              });
            }

            await core.summary
              .addHeading('BOM found in changed PR files')
              .addRaw('发现以下 PR 变更文件存在 BOM，请移除后重新提交：')
              .addRaw('\n\n')
              .addRaw(fileList)
              .write();

            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pull_number,
                  per_page: 100,
                }
              );

              const existingComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  'BOM was found, but this workflow token cannot comment on the PR. ' +
                  'This usually happens when testing from a fork or when repository Actions permissions are read-only.'
                );
              } else {
                throw error;
              }
            }

            core.setFailed('BOM found in changed PR files.');
