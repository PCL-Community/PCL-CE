name: Portable Core

permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore portable graph
        run: dotnet restore PCL.Portable.slnx -p:Configuration=Release
      - name: Build portable graph with warnings as errors
        run: dotnet build PCL.Portable.slnx -c Release --no-restore -warnaserror
      - name: Run portable tests
        # Keep solution build coverage, but run test projects one by one:
        # VSTest solution orchestration can leave Avalonia.Headless test hosts hanging.
        run: |
          dotnet test PCL.Application.Test/PCL.Application.Test.csproj -c Release --no-build --no-restore -warnaserror
          dotnet test PCL.Core.Portable.Test/PCL.Core.Portable.Test.csproj -c Release --no-build --no-restore -warnaserror
          dotnet test PCL.Platform.Test/PCL.Platform.Test.csproj -c Release --no-build --no-restore -warnaserror
          dotnet build-server shutdown
          dotnet test PCL.Desktop.Test/PCL.Desktop.Test.csproj -c Release --no-build --no-restore -warnaserror --blame-hang --blame-hang-timeout 120s
      - name: Cross-compile Avalonia desktop shell and reject platform warnings
        run: dotnet build PCL.Desktop/PCL.Desktop.csproj -c Release --no-restore -p:RuntimeIdentifier=win-x64 -p:PublishAot=false -warnaserror:CA1416

  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish Native AOT smoke test
        run: dotnet publish PCL.Core.Portable.AotSmoke/PCL.Core.Portable.AotSmoke.csproj -c Release -r linux-x64 -warnaserror
      - name: Run Native AOT smoke test
        run: ./PCL.Core.Portable.AotSmoke/bin/Release/net10.0/linux-x64/publish/PCL.Core.Portable.AotSmoke
      - name: Publish application Native AOT launch smoke test
        run: dotnet publish PCL.Application.AotSmoke/PCL.Application.AotSmoke.csproj -c Release -r linux-x64 -warnaserror
      - name: Run application Native AOT launch smoke test
        run: ./PCL.Application.AotSmoke/bin/Release/net10.0/linux-x64/publish/PCL.Application.AotSmoke
  desktop-native-aot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Select desktop runtime
        id: runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if [[ "$(uname -m)" == "arm64" ]]; then
              echo "rid=osx-arm64" >> "$GITHUB_OUTPUT"
            else
              echo "rid=osx-x64" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "rid=linux-x64" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Avalonia desktop Native AOT shell
        run: dotnet publish PCL.Desktop/PCL.Desktop.csproj -c Release -r ${{ steps.runtime.outputs.rid }} -warnaserror
      - name: Validate Avalonia desktop Native AOT shell
        shell: bash
        run: |
          ./PCL.Desktop/bin/Release/net10.0/${{ steps.runtime.outputs.rid }}/publish/PCL.Desktop --validate-environment
          ./PCL.Desktop/bin/Release/net10.0/${{ steps.runtime.outputs.rid }}/publish/PCL.Desktop --validate-assets
