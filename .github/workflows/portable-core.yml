name: Portable Core

permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore portable test graph
        run: dotnet restore PCL.Core.Portable.Test/PCL.Core.Portable.Test.csproj
      - name: Build portable core and tests with warnings as errors
        run: dotnet build PCL.Core.Portable.Test/PCL.Core.Portable.Test.csproj -c Release --no-restore -warnaserror
      - name: Cross-compile Windows shell and reject platform warnings
        run: dotnet build "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" -c Release -p:Platform=x64 -p:EnableWindowsTargeting=true -warnaserror:CA1416
      - name: Run portable tests
        run: dotnet test PCL.Core.Portable.Test/PCL.Core.Portable.Test.csproj -c Release --no-build --no-restore

  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish Native AOT smoke test
        run: dotnet publish PCL.Core.Portable.AotSmoke/PCL.Core.Portable.AotSmoke.csproj -c Release -r linux-x64 -warnaserror
      - name: Run Native AOT smoke test
        run: ./PCL.Core.Portable.AotSmoke/bin/Release/net10.0/linux-x64/publish/PCL.Core.Portable.AotSmoke
