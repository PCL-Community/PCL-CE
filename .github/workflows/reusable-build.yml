name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      target:
        required: true
        type: string
      rid:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: false
        type: string
        default: '0.0.0'

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    env:
      LANG: en_US.UTF-8
      DOTNET: dotnet
      CONFIGURATION: ${{ inputs.configuration }}
      TARGET: ${{ inputs.target }}
      RID: ${{ inputs.rid }}
      PLATFORM: ${{ inputs.platform }}
      VERSION: ${{ inputs.version }}
      ASSET_NAME: PCL2_CE_${{ inputs.configuration }}_${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Describe
        shell: bash
        run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            scripts/package-macos.sh "$RID" "$CONFIGURATION" "$VERSION" dist
          else
            scripts/publish.sh "$RID" "$CONFIGURATION" dist
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path (Join-Path "dist" $env:RID) "*"
          $destination = Join-Path "dist" "$env:ASSET_NAME.zip"
          Compress-Archive -Path $source -DestinationPath $destination -Force

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "dist/${ASSET_NAME}.tar.gz" -C "dist/${RID}" .

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/PCL CE.app" "dist/${ASSET_NAME}.zip"

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL2_CE_${{ inputs.configuration }}_${{ inputs.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
