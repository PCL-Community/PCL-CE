name: Build Avalonia Desktop (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      runner:
        required: true
        type: string
      runtime_id:
        required: true
        type: string
      architecture:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      self_contained:
        required: true
        type: boolean
      runtime_variant:
        required: true
        type: string
      include_plugin:
        required: false
        default: false
        type: boolean
      plugin_tag:
        required: false
        default: latest
        type: string
      require_ms_client_id:
        description: Fail the build when Microsoft OAuth CLIENT_ID secret is missing
        required: false
        default: true
        type: boolean
    secrets:
      # Prefer CLIENT_ID (legacy name). MS_CLIENT_ID / PCL_MS_CLIENT_ID are accepted aliases.
      CLIENT_ID:
        required: false
      MS_CLIENT_ID:
        required: false
      PCL_MS_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      SENTRY_DSN:
        required: false
      NAID_CLIENT_ID:
        required: false
      NAID_CLIENT_SECRET:
        required: false
      LINK_SERVER_ROOTS:
        required: false
      LOBBY_DEFAULT_SECRET:
        required: false
      PCL_PLUGIN_TOKEN:
        required: false

jobs:
  build:
    name: ${{ inputs.runtime_id }} / ${{ inputs.runtime_variant }}
    runs-on: ${{ inputs.runner }}
    env:
      LANG: en_US.UTF-8
      PUBLISH_DIR: artifact
      ARTIFACT_NAME: PCL_N_${{ inputs.configuration }}_${{ inputs.runtime_id }}_${{ inputs.runtime_variant }}
      # Stabilize MSBuild node crashes (MSB4166) on constrained runners.
      DOTNET_CLI_UI_LANGUAGE: en
      MSBUILDDISABLENODEREUSE: 1

    steps:
      - name: Checkout Avalonia branch
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve Microsoft Client ID secret
        id: ms_client
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
        run: |
          set -euo pipefail
          value=""
          if [[ -n "${PCL_MS_CLIENT_ID:-}" ]]; then
            value="$PCL_MS_CLIENT_ID"
          elif [[ -n "${MS_CLIENT_ID:-}" ]]; then
            value="$MS_CLIENT_ID"
          elif [[ -n "${CLIENT_ID:-}" ]]; then
            value="$CLIENT_ID"
          fi
          echo "has_value=$([[ -n "$value" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Mask and export for later steps (do not print value).
          if [[ -n "$value" ]]; then
            echo "::add-mask::$value"
            echo "PCL_MS_CLIENT_ID=$value" >> "$GITHUB_ENV"
          fi

      - name: Require Microsoft Client ID for publish builds
        if: ${{ inputs.require_ms_client_id }}
        shell: bash
        run: |
          if [[ "${{ steps.ms_client.outputs.has_value }}" != "true" ]]; then
            echo "::error::Missing Microsoft OAuth client id secret."
            echo "Add a repository secret named CLIENT_ID (or MS_CLIENT_ID / PCL_MS_CLIENT_ID)."
            echo "It is embedded into the binary at publish time via PCL_WRITE_SECRET."
            exit 1
          fi
          echo "Microsoft CLIENT_ID secret is present (value masked)."

      - name: Download private plugin release
        if: ${{ inputs.include_plugin }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PCL_PLUGIN_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'PCL_PLUGIN_TOKEN is required to download the private PCL.Plugin release.'
          }

          New-Item -ItemType Directory -Force -Path plugin | Out-Null
          $tag = '${{ inputs.plugin_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'latest') {
            gh release download --repo MuXue1230-owo/PCL.Plugin --dir plugin --pattern '*.dll*'
          } else {
            gh release download $tag --repo MuXue1230-owo/PCL.Plugin --dir plugin --pattern '*.dll*'
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download PCL.Plugin release '$tag'."
          }

          $assemblies = @(
            'PCL.Plugin.dll',
            'PCL.N.Plugin.Abstractions.dll',
            'BouncyCastle.Cryptography.dll',
            'jsoncanonicalizer.dll',
            'es6numberserializer.dll'
          )
          foreach ($assembly in $assemblies) {
            $path = Join-Path plugin $assembly
            $checksumPath = "$path.sha256"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                -not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
              throw "PCL.Plugin release is missing $assembly or its checksum."
            }
            $expected = (Get-Content -LiteralPath $checksumPath -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected.ToLowerInvariant()) {
              throw "$assembly checksum mismatch. Expected $expected, got $actual."
            }
          }

      - name: Publish Avalonia desktop
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          # Prefer env written by Resolve step; fall back to raw secrets for other keys.
          PCL_MS_CLIENT_ID: ${{ env.PCL_MS_CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
          PCL_PLUGIN_ASSEMBLY: ${{ github.workspace }}/plugin/PCL.Plugin.dll
          PCL_PLUGIN_ABSTRACTIONS_ASSEMBLY: ${{ github.workspace }}/plugin/PCL.N.Plugin.Abstractions.dll
          PCL_PLUGIN_BOUNCY_CASTLE_ASSEMBLY: ${{ github.workspace }}/plugin/BouncyCastle.Cryptography.dll
          PCL_PLUGIN_JSON_CANONICALIZER_ASSEMBLY: ${{ github.workspace }}/plugin/jsoncanonicalizer.dll
          PCL_PLUGIN_ES6_NUMBER_SERIALIZER_ASSEMBLY: ${{ github.workspace }}/plugin/es6numberserializer.dll
        run: |
          set -euo pipefail
          plugin_args=()
          if [[ "${{ inputs.include_plugin }}" == "true" ]]; then
            plugin_args=(
              -p:PclPluginAssembly="$PCL_PLUGIN_ASSEMBLY"
              -p:PclPluginAbstractionsAssembly="$PCL_PLUGIN_ABSTRACTIONS_ASSEMBLY"
              -p:PclPluginBouncyCastleAssembly="$PCL_PLUGIN_BOUNCY_CASTLE_ASSEMBLY"
              -p:PclPluginJsonCanonicalizerAssembly="$PCL_PLUGIN_JSON_CANONICALIZER_ASSEMBLY"
              -p:PclPluginEs6NumberSerializerAssembly="$PCL_PLUGIN_ES6_NUMBER_SERIALIZER_ASSEMBLY"
            )
          fi

          # Single-node publish reduces MSB4166 child-node crashes under memory pressure.
          dotnet publish PCL.Desktop/PCL.Desktop.csproj \
            -c "${{ inputs.configuration }}" \
            -r "${{ inputs.runtime_id }}" \
            --self-contained "${{ inputs.self_contained }}" \
            -m:1 \
            -nodeReuse:false \
            -p:Platform="${{ inputs.architecture }}" \
            -p:PublishAot=false \
            -p:PublishTrimmed=false \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile="${{ inputs.self_contained }}" \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PclRuntimeVariant="${{ inputs.runtime_variant }}" \
            -p:PclWriteSecret=1 \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:DeleteExistingFiles=true \
            "${plugin_args[@]}" \
            -warnaserror:CA1416 \
            -o "$PUBLISH_DIR"

      - name: Validate Avalonia artifact
        shell: bash
        run: |
          binary="$PUBLISH_DIR/${{ inputs.binary_name }}"
          test -s "$binary" || {
            echo "::error file=$binary::Published Avalonia launcher executable is missing."
            exit 1
          }

          find "$PUBLISH_DIR" -type f \( -name '*.pdb' -o -name '*.xml' -o -name '*.dbg' \) -delete
          file_count=$(find "$PUBLISH_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$file_count" != "1" ]]; then
            echo "::error::Expected one portable Avalonia binary, found $file_count files."
            find "$PUBLISH_DIR" -maxdepth 2 -print
            exit 1
          fi

          chmod +x "$binary" || true

          # Smoke-check embedded secrets when CLIENT_ID was required.
          if [[ "${{ inputs.require_ms_client_id }}" == "true" ]]; then
            if ! "$binary" --validate-secrets; then
              echo "::error::Published binary is missing embedded secrets (PCL_WRITE_SECRET / CLIENT_ID)."
              exit 1
            fi
            echo "Embedded secrets validation passed."
          fi

      - name: Upload Avalonia build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/${{ inputs.binary_name }}
          if-no-files-found: error
