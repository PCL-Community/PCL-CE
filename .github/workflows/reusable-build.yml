name: Build Avalonia Desktop (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      runner:
        required: true
        type: string
      runtime_id:
        required: true
        type: string
      architecture:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      self_contained:
        required: true
        type: boolean
      runtime_variant:
        required: true
        type: string
      include_plugin:
        required: false
        default: false
        type: boolean
      plugin_tag:
        required: false
        default: latest
        type: string
    secrets:
      PCL_PLUGIN_TOKEN:
        required: false

jobs:
  build:
    name: ${{ inputs.runtime_id }} / ${{ inputs.runtime_variant }}
    runs-on: ${{ inputs.runner }}
    env:
      LANG: en_US.UTF-8
      PUBLISH_DIR: artifact
      ARTIFACT_NAME: PCL_N_${{ inputs.configuration }}_${{ inputs.runtime_id }}_${{ inputs.runtime_variant }}

    steps:
      - name: Checkout Avalonia branch
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download private plugin release
        if: ${{ inputs.include_plugin }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PCL_PLUGIN_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'PCL_PLUGIN_TOKEN is required to download the private PCL.Plugin release.'
          }

          New-Item -ItemType Directory -Force -Path plugin | Out-Null
          $tag = '${{ inputs.plugin_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'latest') {
            gh release download --repo MuXue1230-owo/PCL.Plugin --dir plugin --pattern 'PCL.Plugin.dll*'
          } else {
            gh release download $tag --repo MuXue1230-owo/PCL.Plugin --dir plugin --pattern 'PCL.Plugin.dll*'
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download PCL.Plugin release '$tag'."
          }

          $expected = (Get-Content -LiteralPath plugin/PCL.Plugin.dll.sha256 -Raw).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          $actual = (Get-FileHash plugin/PCL.Plugin.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected.ToLowerInvariant()) {
            throw "PCL.Plugin checksum mismatch. Expected $expected, got $actual."
          }

      - name: Publish Avalonia desktop
        shell: bash
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
          PCL_PLUGIN_ASSEMBLY: ${{ github.workspace }}/plugin/PCL.Plugin.dll
        run: |
          plugin_args=()
          if [[ "${{ inputs.include_plugin }}" == "true" ]]; then
            plugin_args=(-p:PclPluginAssembly="$PCL_PLUGIN_ASSEMBLY")
          fi

          dotnet publish PCL.Desktop/PCL.Desktop.csproj \
            -c "${{ inputs.configuration }}" \
            -r "${{ inputs.runtime_id }}" \
            --self-contained "${{ inputs.self_contained }}" \
            -p:Platform="${{ inputs.architecture }}" \
            -p:PublishAot=false \
            -p:PublishTrimmed=false \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile="${{ inputs.self_contained }}" \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PclRuntimeVariant="${{ inputs.runtime_variant }}" \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:DeleteExistingFiles=true \
            "${plugin_args[@]}" \
            -warnaserror:CA1416 \
            -o "$PUBLISH_DIR"

      - name: Validate Avalonia artifact
        shell: bash
        run: |
          binary="$PUBLISH_DIR/${{ inputs.binary_name }}"
          test -s "$binary" || {
            echo "::error file=$binary::Published Avalonia launcher executable is missing."
            exit 1
          }

          find "$PUBLISH_DIR" -type f \( -name '*.pdb' -o -name '*.xml' -o -name '*.dbg' \) -delete
          file_count=$(find "$PUBLISH_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$file_count" != "1" ]]; then
            echo "::error::Expected one portable Avalonia binary, found $file_count files."
            find "$PUBLISH_DIR" -maxdepth 2 -print
            exit 1
          fi

          chmod +x "$binary" || true

      - name: Upload Avalonia build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/${{ inputs.binary_name }}
          if-no-files-found: error
