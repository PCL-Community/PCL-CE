name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      target:
        required: true
        type: string
      rid:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: false
        type: string
        default: '0.0.0'
      include_secrets:
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    env:
      LANG: en_US.UTF-8
      DOTNET: dotnet
      CONFIGURATION: ${{ inputs.configuration }}
      TARGET: ${{ inputs.target }}
      RID: ${{ inputs.rid }}
      PLATFORM: ${{ inputs.platform }}
      VERSION: ${{ inputs.version }}
      ASSET_NAME: PCL2_CE_${{ inputs.configuration }}_${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Describe
        shell: bash
        run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Publish
        shell: bash
        env:
          PCL_WRITE_SECRET: ${{ inputs.include_secrets && '1' || '' }}
          PCL_MS_CLIENT_ID: ${{ inputs.include_secrets && secrets.CLIENT_ID || '' }}
          PCL_CURSEFORGE_API_KEY: ${{ inputs.include_secrets && secrets.CURSEFORGE_API_KEY || '' }}
          PCL_SENTRY_DSN: ${{ inputs.include_secrets && secrets.SENTRY_DSN || '' }}
          PCL_NAID_CLIENT_ID: ${{ inputs.include_secrets && secrets.NAID_CLIENT_ID || '' }}
          PCL_NAID_CLIENT_SECRET: ${{ inputs.include_secrets && secrets.NAID_CLIENT_SECRET || '' }}
          PCL_LINK_SERVER_ROOT: ${{ inputs.include_secrets && secrets.LINK_SERVER_ROOTS || '' }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ inputs.include_secrets && secrets.LOBBY_DEFAULT_SECRET || '' }}
          PCL_GITHUB_SHA: ${{ github.sha }}
          CODESIGN_IDENTITY: ${{ inputs.include_secrets && runner.os == 'macOS' && secrets.APPLE_CODESIGN_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.include_secrets && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.include_secrets && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.include_secrets && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            scripts/package-macos.sh "$RID" "$CONFIGURATION" "$VERSION" dist
          else
            scripts/publish.sh "$RID" "$CONFIGURATION" dist
          fi

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          case "$(uname -m)" in
            x86_64) NFPM_ARCH=x86_64; APPIMAGE_ARCH=x86_64 ;;
            aarch64|arm64) NFPM_ARCH=arm64; APPIMAGE_ARCH=aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          curl -sSfL \
            "https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_${NFPM_ARCH}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" nfpm
          curl -sSfL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod 0755 "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path (Join-Path "dist" $env:RID) "*"
          $destination = Join-Path "dist" "$env:ASSET_NAME.zip"
          Compress-Archive -Path $source -DestinationPath $destination -Force

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/package-linux.sh "$RID" "$CONFIGURATION" "$VERSION" dist

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/PCL CE.app" "dist/${ASSET_NAME}.zip"
          DMG_ROOT="dist/.dmg-root-${RID}"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          cp -a "dist/PCL CE.app" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "PCL CE" -srcfolder "$DMG_ROOT" \
            -ov -format UDZO "dist/${ASSET_NAME}.dmg"
          rm -rf "$DMG_ROOT"

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL2_CE_${{ inputs.configuration }}_${{ inputs.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
